services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eveland
      POSTGRES_PASSWORD: eveland
      POSTGRES_DB: eveland
    ports:
      - "5432:5432"
    volumes:
      - eveland-postgres:/var/lib/postgresql/data

  api:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install && pnpm --filter @eveland/api dev"
    depends_on:
      - postgres
    environment:
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://eveland:eveland@postgres:5432/eveland
      APP_SECRET_KEY: eveland-dev-secret-key-000000000
      EVELAND_DATA_DIR: /workspace/.eveland-data
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install && pnpm --filter @eveland/web dev"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace

  worker:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install && pnpm --filter @eveland/worker dev"
    depends_on:
      - api
      - postgres
    environment:
      DATABASE_URL: postgres://eveland:eveland@postgres:5432/eveland
      EVELAND_DATA_DIR: /workspace/.eveland-data
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  eveland-postgres:
