services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eveland
      POSTGRES_PASSWORD: eveland
      POSTGRES_DB: eveland
    ports:
      - "5432:5432"
    volumes:
      - eveland-postgres:/var/lib/postgresql/data

  otel-config-init:
    image: alpine:3.22
    command:
      - sh
      - -c
      - >-
        install -d -m 0700 /var/lib/eveland/otel &&
        if [ ! -f /var/lib/eveland/otel/collector.yaml ]; then
          install -m 0600 /seed/collector.yaml /var/lib/eveland/otel/collector.yaml;
        fi
    volumes:
      - ./infra/otel/collector.yaml:/seed/collector.yaml:ro
      - ./.eveland-data/otel:/var/lib/eveland/otel

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: ${EVELAND_OTEL_COLLECTOR_CONTAINER:-eveland-otel-collector}
    user: "0:0"
    command:
      - --config=/var/lib/eveland/otel/collector.yaml
    depends_on:
      otel-config-init:
        condition: service_completed_successfully
    environment:
      EVELAND_BUILTIN_OTLP_ENDPOINT: http://host.docker.internal:4000/internal/otel
      EVELAND_EXTERNAL_OTLP_PROXY_ENDPOINT: http://host.docker.internal:4000/internal/observability/destinations
      EVELAND_OTLP_SERVICE_TOKEN: ${EVELAND_OTLP_SERVICE_TOKEN:-eveland-dev-otlp-service-token}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4327:4327"
      - "127.0.0.1:4328:4328"
    volumes:
      - ./.eveland-data/otel:/var/lib/eveland/otel:ro
      - eveland-otel-collector:/var/lib/otelcol

  api:
    image: node:24-alpine
    working_dir: /workspace
    # unzip (Info-ZIP): zip-upload extraction shells out to `unzip -Z1`; node:24-alpine only ships
    # BusyBox unzip, which lacks -Z. The apk `unzip` is Info-ZIP and shadows the BusyBox applet.
    command: sh -lc "apk add --no-cache unzip && corepack enable && pnpm install && pnpm --filter @eveland/api dev"
    depends_on:
      - gateway
      - postgres
    environment:
      CI: "true"
      # Explicit: eveland-dev-* fallback secrets only apply under NODE_ENV=development.
      NODE_ENV: development
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://eveland:eveland@postgres:5432/eveland
      APP_SECRET_KEY: eveland-dev-secret-key-000000000
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      EVELAND_ADMIN_EMAIL: ${EVELAND_ADMIN_EMAIL:-admin@example.com}
      EVELAND_ADMIN_PASSWORD: "${EVELAND_ADMIN_PASSWORD:?set EVELAND_ADMIN_PASSWORD}"
      EVELAND_RELEASE_CHANNEL: ${EVELAND_RELEASE_CHANNEL:-dev}
      EVELAND_REVISION: ${EVELAND_REVISION:-unknown}
      EVELAND_COOKIE_DOMAIN: ${EVELAND_COOKIE_DOMAIN:-}
      EVELAND_IDENTITY_ISSUER: ${EVELAND_IDENTITY_ISSUER:-http://localhost:4000}
      EVELAND_IDENTITY_ALLOWED_ORIGINS: ${EVELAND_IDENTITY_ALLOWED_ORIGINS:-http://localhost:3010}
      EVELAND_DATA_DIR: /workspace/.eveland-data
      EVELAND_GATEWAY_INTERNAL_URL: http://gateway:4080
      EVELAND_GATEWAY_SERVICE_TOKEN: ${EVELAND_GATEWAY_SERVICE_TOKEN:-eveland-dev-gateway-token}
      EVELAND_OTLP_ENDPOINT: http://otel-collector:4318
      EVELAND_OTLP_SERVICE_TOKEN: ${EVELAND_OTLP_SERVICE_TOKEN:-eveland-dev-otlp-service-token}
      EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST: ${EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST:-}
      EVELAND_ACTIVATION_LEASE_TTL_MS: ${EVELAND_ACTIVATION_LEASE_TTL_MS:-180000}
      EVELAND_PLAYGROUND_SESSION_IDLE_TTL_MS: ${EVELAND_PLAYGROUND_SESSION_IDLE_TTL_MS:-86400000}
      EVELAND_API_SESSION_IDLE_TTL_MS: ${EVELAND_API_SESSION_IDLE_TTL_MS:-604800000}
      EVELAND_COLD_START_TIMEOUT_MS: ${EVELAND_COLD_START_TIMEOUT_MS:-30000}
      EVELAND_SOURCE_PREFLIGHT_TTL_MS: ${EVELAND_SOURCE_PREFLIGHT_TTL_MS:-3600000}
      EVELAND_RELEASE_RETENTION: ${EVELAND_RELEASE_RETENTION:-3}
      EVELAND_SCHEDULER_RUNTIME_SECRET: ${EVELAND_SCHEDULER_RUNTIME_SECRET:-eveland-dev-scheduler-runtime-secret}
      EVELAND_SCHEDULER_DISPATCH_SECRET: ${EVELAND_SCHEDULER_DISPATCH_SECRET:-eveland-dev-scheduler-dispatch-secret}
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace

  gateway:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install && pnpm --filter @eveland/gateway dev"
    depends_on:
      - postgres
    environment:
      CI: "true"
      # Explicit: eveland-dev-* fallback secrets only apply under NODE_ENV=development.
      NODE_ENV: development
      GATEWAY_PORT: 4080
      DATABASE_URL: postgres://eveland:eveland@postgres:5432/eveland
      EVELAND_AGENT_BASE_DOMAINS: ${EVELAND_AGENT_BASE_DOMAINS:-agent.localhost}
      EVELAND_GATEWAY_SERVICE_TOKEN: ${EVELAND_GATEWAY_SERVICE_TOKEN:-eveland-dev-gateway-token}
      EVELAND_GATEWAY_AFFINITY_SECRET: ${EVELAND_GATEWAY_AFFINITY_SECRET:-eveland-dev-affinity-secret}
      EVELAND_GATEWAY_MAX_REQUEST_BODY_BYTES: ${EVELAND_GATEWAY_MAX_REQUEST_BODY_BYTES:-10485760}
      EVELAND_GATEWAY_PUBLIC_SCHEME: ${EVELAND_GATEWAY_PUBLIC_SCHEME:-http}
      EVELAND_API_INTERNAL_URL: http://api:4000
      EVELAND_OTLP_ENDPOINT: http://otel-collector:4318
      EVELAND_OTLP_SERVICE_TOKEN: ${EVELAND_OTLP_SERVICE_TOKEN:-eveland-dev-otlp-service-token}
      EVELAND_ACTIVATION_RENEW_INTERVAL_MS: ${EVELAND_ACTIVATION_RENEW_INTERVAL_MS:-60000}
      EVELAND_PLAYGROUND_SESSION_IDLE_TTL_MS: ${EVELAND_PLAYGROUND_SESSION_IDLE_TTL_MS:-86400000}
      EVELAND_API_SESSION_IDLE_TTL_MS: ${EVELAND_API_SESSION_IDLE_TTL_MS:-604800000}
      EVELAND_RELEASE_CHANNEL: ${EVELAND_RELEASE_CHANNEL:-dev}
      EVELAND_REVISION: ${EVELAND_REVISION:-unknown}
    ports:
      - "4080:4080"
    volumes:
      - .:/workspace
      # The repository bind is for live application code only. Hide imported project
      # sources, runtime state, and encrypted secret material from the public proxy.
      - eveland-gateway-data-mask:/workspace/.eveland-data

  web:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install && pnpm --filter @eveland/web dev"
    depends_on:
      - api
    environment:
      CI: "true"
      # Explicit: eveland-dev-* fallback secrets only apply under NODE_ENV=development.
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://api:4000
      EVELAND_RELEASE_CHANNEL: ${EVELAND_RELEASE_CHANNEL:-dev}
      EVELAND_REVISION: ${EVELAND_REVISION:-unknown}
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace

  worker:
    image: node:24-alpine
    working_dir: /workspace
    # git: import_source shells out to `git clone`. docker-cli: build_deploy shells out to
    # `docker build`/`docker run` via the mounted docker.sock. node:24-alpine ships neither.
    command: sh -lc "apk add --no-cache git docker-cli && corepack enable && pnpm install && pnpm --filter @eveland/worker dev"
    depends_on:
      - api
      - postgres
    environment:
      CI: "true"
      # Explicit: eveland-dev-* fallback secrets only apply under NODE_ENV=development.
      NODE_ENV: development
      DATABASE_URL: postgres://eveland:eveland@postgres:5432/eveland
      WORKFLOW_POSTGRES_URL: postgres://eveland:eveland@host.docker.internal:5432/eveland
      # The worker bootstraps the same database through its Compose-reachable address;
      # deployed Agent containers keep using the host-gateway address above.
      WORKFLOW_POSTGRES_BOOTSTRAP_URL: postgres://eveland:eveland@postgres:5432/eveland
      EVELAND_DATA_DIR: /workspace/.eveland-data
      # docker run bind mounts are resolved by the host daemon, not inside this container.
      EVELAND_HOST_DATA_DIR: ${EVELAND_HOST_DATA_DIR:-${PWD}/.eveland-data}
      EVELAND_RUNTIME: docker
      EVELAND_OTLP_ENDPOINT: http://otel-collector:4318
      EVELAND_OTLP_SERVICE_TOKEN: ${EVELAND_OTLP_SERVICE_TOKEN:-eveland-dev-otlp-service-token}
      # The Worker probes destination health directly, so it must apply the same
      # allowlist the API uses or an allowlisted private destination reads degraded.
      EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST: ${EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST:-}
      EVELAND_GIT_CLONE_TIMEOUT_MS: ${EVELAND_GIT_CLONE_TIMEOUT_MS:-120000}
      EVELAND_GIT_CLONE_MAX_ATTEMPTS: ${EVELAND_GIT_CLONE_MAX_ATTEMPTS:-3}
      EVELAND_GIT_CLONE_RETRY_DELAY_MS: ${EVELAND_GIT_CLONE_RETRY_DELAY_MS:-1000}
      WORKER_JOB_HEARTBEAT_INTERVAL_MS: ${WORKER_JOB_HEARTBEAT_INTERVAL_MS:-30000}
      WORKER_JOB_STALE_MS: ${WORKER_JOB_STALE_MS:-120000}
      WORKER_JOB_RECOVERY_BATCH_SIZE: ${WORKER_JOB_RECOVERY_BATCH_SIZE:-25}
      EVELAND_HOST_METRIC_INTERVAL_MS: ${EVELAND_HOST_METRIC_INTERVAL_MS:-60000}
      EVELAND_AGENT_BASE_DOMAINS: ${EVELAND_AGENT_BASE_DOMAINS:-agent.localhost}
      EVELAND_GATEWAY_INTERNAL_URL: http://gateway:4080
      EVELAND_GATEWAY_SERVICE_TOKEN: ${EVELAND_GATEWAY_SERVICE_TOKEN:-eveland-dev-gateway-token}
      EVELAND_IDENTITY_ISSUER: ${EVELAND_IDENTITY_ISSUER:-http://localhost:4000}
      EVELAND_IDENTITY_JWKS_URL: ${EVELAND_IDENTITY_JWKS_URL:-http://host.docker.internal:4000/.well-known/jwks.json}
      EVELAND_SCHEDULER_RUNTIME_SECRET: ${EVELAND_SCHEDULER_RUNTIME_SECRET:-eveland-dev-scheduler-runtime-secret}
      EVELAND_SCHEDULER_DISPATCH_SECRET: ${EVELAND_SCHEDULER_DISPATCH_SECRET:-eveland-dev-scheduler-dispatch-secret}
      EVELAND_SCHEDULER_REDEEM_URL: ${EVELAND_SCHEDULER_REDEEM_URL:-http://host.docker.internal:4000/internal/scheduler/dispatch}
      EVELAND_SCHEDULER_PLANNER_BATCH_SIZE: ${EVELAND_SCHEDULER_PLANNER_BATCH_SIZE:-25}
      EVELAND_SCHEDULE_RUN_MAX_RUNTIME_MS: ${EVELAND_SCHEDULE_RUN_MAX_RUNTIME_MS:-86400000}
      EVELAND_SCHEDULER_PREWARM_MS: ${EVELAND_SCHEDULER_PREWARM_MS:-60000}
      EVELAND_ACTIVATION_IDLE_TTL_MS: ${EVELAND_ACTIVATION_IDLE_TTL_MS:-300000}
      EVELAND_ACTIVATION_REAPER_BATCH_SIZE: ${EVELAND_ACTIVATION_REAPER_BATCH_SIZE:-25}
      EVELAND_ACTIVATION_RECOVERY_BATCH_SIZE: ${EVELAND_ACTIVATION_RECOVERY_BATCH_SIZE:-25}
      EVELAND_ACTIVATION_START_STALE_MS: ${EVELAND_ACTIVATION_START_STALE_MS:-300000}
      EVELAND_ACTIVATION_RECONCILE_BATCH_SIZE: ${EVELAND_ACTIVATION_RECONCILE_BATCH_SIZE:-100}
      EVELAND_ORPHAN_SWEEP_INTERVAL_MS: ${EVELAND_ORPHAN_SWEEP_INTERVAL_MS:-3600000}
      EVELAND_ORPHAN_GRACE_MS: ${EVELAND_ORPHAN_GRACE_MS:-300000}
      EVELAND_RELEASE_RETENTION: ${EVELAND_RELEASE_RETENTION:-3}
      EVELAND_PLAYGROUND_SESSION_IDLE_TTL_MS: ${EVELAND_PLAYGROUND_SESSION_IDLE_TTL_MS:-86400000}
      EVELAND_API_SESSION_IDLE_TTL_MS: ${EVELAND_API_SESSION_IDLE_TTL_MS:-604800000}
      EVELAND_RELEASE_SWEEP_INTERVAL_MS: ${EVELAND_RELEASE_SWEEP_INTERVAL_MS:-3600000}
      EVELAND_RELEASE_SWEEP_BATCH_SIZE: ${EVELAND_RELEASE_SWEEP_BATCH_SIZE:-25}
      EVELAND_RELEASE_CHANNEL: ${EVELAND_RELEASE_CHANNEL:-dev}
      EVELAND_REVISION: ${EVELAND_REVISION:-unknown}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  eveland-postgres:
  eveland-otel-collector:
  eveland-gateway-data-mask:
