# Linux native-development overlay. The API and the other platform processes
# run on the host, while the Collector stays bridged so the Docker runtime can
# attach it to every Agent telemetry network. The API separately binds its
# runtime-only ingress to the private Docker bridge address configured by
# EVELAND_API_DOCKER_BRIDGE_HOST.
services:
  otel-collector:
    environment:
      EVELAND_BUILTIN_OTLP_ENDPOINT: http://host.docker.internal:17301/internal/otel
      EVELAND_EXTERNAL_OTLP_PROXY_ENDPOINT: http://host.docker.internal:17301/internal/observability/destinations
