extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/collector_self:
    config:
      scrape_configs:
        - job_name: eveland-otel-collector
          scrape_interval: 15s
          static_configs:
            - targets:
                - 127.0.0.1:8888

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 1024
  filter/builtin_eveland:
    error_mode: ignore
    log_conditions:
      - 'resource.attributes["eveland.telemetry.domain"] != "agent" and resource.attributes["eveland.telemetry.domain"] != "platform" and resource.attributes["eveland.telemetry.domain"] != "runtime" and resource.attributes["eveland.telemetry.domain"] != "capacity"'
    metric_conditions:
      - 'resource.attributes["eveland.telemetry.domain"] != "agent" and resource.attributes["eveland.telemetry.domain"] != "platform" and resource.attributes["eveland.telemetry.domain"] != "runtime" and resource.attributes["eveland.telemetry.domain"] != "capacity"'
  resource/collector_self:
    attributes:
      - key: service.name
        value: eveland-otel-collector
        action: upsert
      - key: service.instance.id
        value: ${env:HOSTNAME}
        action: upsert
      - key: eveland.team.id
        value: team_local
        action: upsert
      - key: eveland.telemetry.domain
        value: platform
        action: upsert

exporters:
  otlp_http/builtin:
    endpoint: ${env:EVELAND_BUILTIN_OTLP_ENDPOINT}
    compression: none
    headers:
      authorization: "Bearer ${env:EVELAND_OTLP_SERVICE_TOKEN}"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000

service:
  extensions:
    - file_storage
    - health_check
  pipelines:
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/builtin_eveland
        - batch
      exporters:
        - otlp_http/builtin
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/builtin_eveland
        - batch
      exporters:
        - otlp_http/builtin
  telemetry:
    resource:
      service.name: eveland-otel-collector
      service.instance.id: ${env:HOSTNAME}
      eveland.team.id: team_local
      eveland.telemetry.domain: platform
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
                without_type_suffix: true
                without_units: true
