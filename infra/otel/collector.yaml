extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 1024
  filter/builtin_eveland:
    error_mode: ignore
    trace_conditions:
      - 'resource.attributes["eveland.telemetry.domain"] != "agent" and resource.attributes["eveland.telemetry.domain"] != "platform" and resource.attributes["eveland.telemetry.domain"] != "runtime" and resource.attributes["eveland.telemetry.domain"] != "capacity"'
    log_conditions:
      - 'resource.attributes["eveland.telemetry.domain"] != "agent" and resource.attributes["eveland.telemetry.domain"] != "platform" and resource.attributes["eveland.telemetry.domain"] != "runtime" and resource.attributes["eveland.telemetry.domain"] != "capacity"'
    metric_conditions:
      - 'resource.attributes["eveland.telemetry.domain"] != "agent" and resource.attributes["eveland.telemetry.domain"] != "platform" and resource.attributes["eveland.telemetry.domain"] != "runtime" and resource.attributes["eveland.telemetry.domain"] != "capacity"'

exporters:
  otlp_http/builtin:
    endpoint: ${env:EVELAND_BUILTIN_OTLP_ENDPOINT}
    encoding: json
    compression: none
    headers:
      authorization: "Bearer ${env:EVELAND_OTLP_SERVICE_TOKEN}"
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000

service:
  extensions:
    - file_storage
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/builtin_eveland
        - batch
      exporters:
        - otlp_http/builtin
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/builtin_eveland
        - batch
      exporters:
        - otlp_http/builtin
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/builtin_eveland
        - batch
      exporters:
        - otlp_http/builtin
