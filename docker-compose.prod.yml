# Production overlay for a single-box (Linux) deployment. Every platform process -- API, Agent
# Gateway, Dashboard, worker, workflow dispatcher -- runs on the host as a systemd service (see
# docs/en/production/core-services.md). What is left here is the OTLP Collector, plus the bundled
# Postgres for installations that did not bring their own.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d otel-collector postgres
#
# Set the two public URLs in a local .env (gitignored) for the target environment:
#   EVELAND_PUBLIC_ORIGIN=https://your-host    # the single browser-visible origin (front door)
#   EVELAND_IDENTITY_ALLOWED_ORIGINS=https://your-chat-host  # only with an external chat frontend
#   BETTER_AUTH_SECRET=<long-random-secret>    # independent auth encryption/signing secret
# Better Auth URL, CORS origin, and the Identity issuer all derive from
# EVELAND_PUBLIC_ORIGIN unless individually overridden.
#
# Deployed agent data lives under /var/lib/eveland on the host, which every platform unit and every
# Deployment now reads at that one absolute path -- no bind mount, and no second view of it.
#
# Why no platform service is here: production runs every Deployment as a host systemd process bound
# to the host's 127.0.0.1:PORT (loopback, not public), so the Agent Gateway (public proxy + internal
# Playground) reaches an Agent only from the host's own network namespace -- which is to say, as a
# host process. Once the front door is a host process, keeping the others in containers buys
# nothing: each was a stock node image with the host source tree bind-mounted in, re-installing the
# dependency tree on every start and running as container root. They are systemd units instead
# (packages/ctl/src/systemd-mode.ts), and this file gates the base file's development copies behind
# profiles the production command never enables.
#
# How the Collector still reaches the API: it is the one container left that has to dial in, and a
# host-native API is not reachable from a bridge over loopback. So it dials `host.docker.internal`
# (Docker's host-gateway) and the API binds a second, path-allowlisted listener on that same
# address -- EVELAND_API_DOCKER_BRIDGE_HOST, which eveland-ctl detects on every start. The network
# contract still holds: the API's own listener is loopback-only.
services:
  otel-config-init:
    volumes: !override
      - ./infra/otel/collector.yaml:/seed/collector.yaml:ro
      - /var/lib/eveland/otel:/var/lib/eveland/otel

  otel-collector:
    restart: unless-stopped
    environment:
      EVELAND_OTLP_SERVICE_TOKEN: "${EVELAND_OTLP_SERVICE_TOKEN:?set EVELAND_OTLP_SERVICE_TOKEN}"
      # The API is a host process here, so the base file's `api` service name
      # resolves to nothing. host.docker.internal is Docker's host-gateway
      # (the base file already declares the extra_host), and the API binds a
      # path-allowlisted listener there -- see the header.
      EVELAND_BUILTIN_OTLP_ENDPOINT: http://host.docker.internal:17301/internal/otel
      EVELAND_EXTERNAL_OTLP_PROXY_ENDPOINT: http://host.docker.internal:17301/internal/observability/destinations
    volumes: !override
      - /var/lib/eveland/otel:/var/lib/eveland/otel:ro
      - eveland-otel-collector:/var/lib/otelcol

  postgres:
    restart: unless-stopped

  api:
    # The Platform API is a host systemd unit (eveland-api.service). It was the
    # last service in the bridge network, and the only reason the installation
    # needed a second address for the shared workflow database; on the host it
    # dials the one DSN every other process uses. Gate the base file's
    # development API behind a profile the production command never enables.
    profiles: ["dev-api"]

  gateway:
    # The public front door is a host systemd unit (eveland-gateway.service):
    # it must reach every Deployment on the host's 127.0.0.1:18xxx, and the
    # host IS its network. Gate the base file's development gateway behind a
    # profile the production command never enables so the merged config cannot
    # start a second front door on the same port.
    profiles: ["dev-gateway"]

  workflow-dispatcher:
    # Exactly one dispatcher may drive the production shared workflow database:
    # the host systemd service (docs/en/production/workflow-dispatcher.md). Gate
    # the base file's development dispatcher behind a profile the production
    # command never enables so the merged config cannot start a second one.
    profiles: ["dev-dispatcher"]

  web:
    # The Dashboard is a host systemd unit (eveland-web.service), built once on
    # the host instead of rebuilt inside a container on every start. Same
    # profile gate as the gateway above.
    profiles: ["dev-web"]

  worker:
    # Production runs the host systemd Worker (docs/en/production/worker.md).
    # Gate the base file's development Worker behind a profile the production
    # command never enables so the merged config cannot start a second one.
    profiles: ["dev-worker"]
