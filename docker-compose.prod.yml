# Production overlay for a single-box (Linux) deployment. API/Web/Postgres run in Docker
# Compose; the worker runs on the host as a systemd service (infra/systemd/eveland-worker.service,
# see docs/deploy/linux.md). For legacy Docker-runtime installs, the containerized worker is
# available via `--profile docker-worker`.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Set the two public URLs in a local .env (gitignored) for the target environment:
#   WEB_ORIGIN=https://your-web-host          # CORS allow-origin for the API
#   NEXT_PUBLIC_API_URL=https://your-api-host  # where the browser calls the API (baked in at build)
#   BETTER_AUTH_URL=https://your-api-host      # browser-visible Better Auth API origin
#   EVELAND_IDENTITY_ISSUER=https://your-api-host
#   EVELAND_IDENTITY_ALLOWED_ORIGINS=https://your-chat-host
#   BETTER_AUTH_SECRET=<long-random-secret>    # independent auth encryption/signing secret
# They default to localhost so `up` works with no .env for a quick bring-up.
#
# Deployed agent data lives under /var/lib/eveland on the host, bind-mounted into the API at the
# same absolute path so database sourcePath values are valid in both places.
#
# Why host networking: deployed agent containers publish on the host's 127.0.0.1:PORT (loopback,
# not public); the worker (health check) and Gateway (public proxy + internal Playground) reach them on that same
# loopback only if they share the host's network. On host network the compose service DNS
# (postgres/api) is gone, so services talk over localhost; postgres stays bridged but publishes
# 5432 to the host. `ports: !override []` clears base published ports (incompatible with host net).
#
# NODE_ENV=production is set only on the runtime command — setting it container-wide makes
# `pnpm install` skip devDependencies (tsx / the next build toolchain) and the stack fails to start.
services:
  otel-config-init:
    volumes: !override
      - ./infra/otel/collector.yaml:/seed/collector.yaml:ro
      - /var/lib/eveland/otel:/var/lib/eveland/otel

  otel-collector:
    restart: unless-stopped
    environment:
      EVELAND_OTLP_SERVICE_TOKEN: "${EVELAND_OTLP_SERVICE_TOKEN:?set EVELAND_OTLP_SERVICE_TOKEN}"
    volumes: !override
      - /var/lib/eveland/otel:/var/lib/eveland/otel:ro
      - eveland-otel-collector:/var/lib/otelcol

  postgres:
    restart: unless-stopped

  api:
    restart: unless-stopped
    network_mode: host
    ports: !override []
    command: sh -lc "apk add --no-cache unzip && corepack enable && pnpm install && cd apps/api && NODE_ENV=production pnpm exec tsx --env-file=../../.env src/server.ts"
    environment:
      CI: "true"
      DATABASE_URL: postgres://eveland:eveland@localhost:5432/eveland
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:3000}"
      EVELAND_DATA_DIR: /var/lib/eveland
      EVELAND_OTLP_ENDPOINT: http://127.0.0.1:4318
      EVELAND_OTLP_SERVICE_TOKEN: "${EVELAND_OTLP_SERVICE_TOKEN:?set EVELAND_OTLP_SERVICE_TOKEN}"
      EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST: "${EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST:-}"
      EVELAND_GATEWAY_INTERNAL_URL: http://127.0.0.1:4080
      EVELAND_GATEWAY_SERVICE_TOKEN: "${EVELAND_GATEWAY_SERVICE_TOKEN:?set EVELAND_GATEWAY_SERVICE_TOKEN}"
      EVELAND_ACTIVATION_LEASE_TTL_MS: "${EVELAND_ACTIVATION_LEASE_TTL_MS:-180000}"
      EVELAND_COLD_START_TIMEOUT_MS: "${EVELAND_COLD_START_TIMEOUT_MS:-30000}"
      EVELAND_GATEWAY_PUBLIC_SCHEME: https
      EVELAND_GATEWAY_PUBLIC_PORT: 0
      EVELAND_IDENTITY_ISSUER: "${EVELAND_IDENTITY_ISSUER:?set EVELAND_IDENTITY_ISSUER}"
      EVELAND_IDENTITY_ALLOWED_ORIGINS: "${EVELAND_IDENTITY_ALLOWED_ORIGINS:?set EVELAND_IDENTITY_ALLOWED_ORIGINS}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:?set APP_SECRET_KEY}"
      EVELAND_SCHEDULER_RUNTIME_SECRET: "${EVELAND_SCHEDULER_RUNTIME_SECRET:?set EVELAND_SCHEDULER_RUNTIME_SECRET}"
      EVELAND_SCHEDULER_DISPATCH_SECRET: "${EVELAND_SCHEDULER_DISPATCH_SECRET:?set EVELAND_SCHEDULER_DISPATCH_SECRET}"
      EVELAND_RELEASE_CHANNEL: "${EVELAND_RELEASE_CHANNEL:-stable}"
      EVELAND_REVISION: "${EVELAND_REVISION:-unknown}"
    volumes:
      - .:/workspace
      - /var/lib/eveland:/var/lib/eveland

  gateway:
    restart: unless-stopped
    network_mode: host
    ports: !override []
    command: sh -lc "corepack enable && pnpm install && cd apps/gateway && NODE_ENV=production pnpm exec tsx --env-file=../../.env src/server.ts"
    environment:
      CI: "true"
      DATABASE_URL: postgres://eveland:eveland@localhost:5432/eveland
      GATEWAY_PORT: 4080
      EVELAND_AGENT_BASE_DOMAINS: "${EVELAND_AGENT_BASE_DOMAINS:?set EVELAND_AGENT_BASE_DOMAINS}"
      EVELAND_GATEWAY_SERVICE_TOKEN: "${EVELAND_GATEWAY_SERVICE_TOKEN:?set EVELAND_GATEWAY_SERVICE_TOKEN}"
      EVELAND_GATEWAY_AFFINITY_SECRET: "${EVELAND_GATEWAY_AFFINITY_SECRET:?set EVELAND_GATEWAY_AFFINITY_SECRET}"
      EVELAND_GATEWAY_MAX_REQUEST_BODY_BYTES: "${EVELAND_GATEWAY_MAX_REQUEST_BODY_BYTES:-10485760}"
      EVELAND_GATEWAY_PUBLIC_SCHEME: https
      EVELAND_API_INTERNAL_URL: http://127.0.0.1:4000
      EVELAND_OTLP_ENDPOINT: http://127.0.0.1:4318
      EVELAND_OTLP_SERVICE_TOKEN: "${EVELAND_OTLP_SERVICE_TOKEN:?set EVELAND_OTLP_SERVICE_TOKEN}"
      EVELAND_ACTIVATION_RENEW_INTERVAL_MS: "${EVELAND_ACTIVATION_RENEW_INTERVAL_MS:-60000}"
      EVELAND_RELEASE_CHANNEL: "${EVELAND_RELEASE_CHANNEL:-stable}"
      EVELAND_REVISION: "${EVELAND_REVISION:-unknown}"

  web:
    restart: unless-stopped
    network_mode: host
    ports: !override []
    command: sh -lc "corepack enable && pnpm install && NODE_ENV=production pnpm --filter @eveland/web build && NODE_ENV=production pnpm --filter @eveland/web exec next start --port 3000"
    environment:
      CI: "true"
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
      EVELAND_RELEASE_CHANNEL: "${EVELAND_RELEASE_CHANNEL:-stable}"
      EVELAND_REVISION: "${EVELAND_REVISION:-unknown}"

  worker:
    profiles: ["docker-worker"]
    restart: unless-stopped
    network_mode: host
    command: sh -lc "apk add --no-cache git docker-cli && corepack enable && pnpm install && cd apps/worker && NODE_ENV=production pnpm exec tsx --env-file=../../.env src/worker.ts"
    # The host-network worker bootstraps through the published host Postgres port;
    # deployments keep the base file's host.docker.internal URL. That resolves inside
    # deployed agent containers here: the docker adapter starts every agent container
    # with `--add-host host.docker.internal:host-gateway` (runtime/docker.ts), which is
    # independent of network_mode: host on this worker container itself.
    environment:
      CI: "true"
      DATABASE_URL: postgres://eveland:eveland@localhost:5432/eveland
      WORKFLOW_POSTGRES_BOOTSTRAP_URL: postgres://eveland:eveland@127.0.0.1:5432/eveland
      EVELAND_RUNTIME: docker
      EVELAND_DATA_DIR: /var/lib/eveland
      EVELAND_OTLP_ENDPOINT: http://127.0.0.1:4318
      EVELAND_OTLP_SERVICE_TOKEN: "${EVELAND_OTLP_SERVICE_TOKEN:?set EVELAND_OTLP_SERVICE_TOKEN}"
      # The Worker probes destination health directly, so it must apply the same
      # allowlist the API uses or an allowlisted private destination reads degraded.
      EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST: "${EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST:-}"
      # Agent container bind mounts resolve on the host.
      EVELAND_HOST_DATA_DIR: /var/lib/eveland
      EVELAND_AGENT_BASE_DOMAINS: "${EVELAND_AGENT_BASE_DOMAINS:?set EVELAND_AGENT_BASE_DOMAINS}"
      EVELAND_GATEWAY_INTERNAL_URL: http://127.0.0.1:4080
      EVELAND_GATEWAY_SERVICE_TOKEN: "${EVELAND_GATEWAY_SERVICE_TOKEN:?set EVELAND_GATEWAY_SERVICE_TOKEN}"
      EVELAND_SCHEDULER_RUNTIME_SECRET: "${EVELAND_SCHEDULER_RUNTIME_SECRET:?set EVELAND_SCHEDULER_RUNTIME_SECRET}"
      EVELAND_SCHEDULER_DISPATCH_SECRET: "${EVELAND_SCHEDULER_DISPATCH_SECRET:?set EVELAND_SCHEDULER_DISPATCH_SECRET}"
      EVELAND_SCHEDULER_REDEEM_URL: "${EVELAND_SCHEDULER_REDEEM_URL:-http://host.docker.internal:4000/internal/scheduler/dispatch}"
      EVELAND_SCHEDULER_PREWARM_MS: "${EVELAND_SCHEDULER_PREWARM_MS:-60000}"
      EVELAND_ACTIVATION_IDLE_TTL_MS: "${EVELAND_ACTIVATION_IDLE_TTL_MS:-300000}"
      EVELAND_ACTIVATION_REAPER_BATCH_SIZE: "${EVELAND_ACTIVATION_REAPER_BATCH_SIZE:-25}"
      EVELAND_ACTIVATION_RECOVERY_BATCH_SIZE: "${EVELAND_ACTIVATION_RECOVERY_BATCH_SIZE:-25}"
      EVELAND_ACTIVATION_START_STALE_MS: "${EVELAND_ACTIVATION_START_STALE_MS:-300000}"
      EVELAND_ACTIVATION_RECONCILE_BATCH_SIZE: "${EVELAND_ACTIVATION_RECONCILE_BATCH_SIZE:-100}"
      EVELAND_ORPHAN_SWEEP_INTERVAL_MS: "${EVELAND_ORPHAN_SWEEP_INTERVAL_MS:-3600000}"
      EVELAND_ORPHAN_GRACE_MS: "${EVELAND_ORPHAN_GRACE_MS:-300000}"
      EVELAND_RELEASE_RETENTION: "${EVELAND_RELEASE_RETENTION:-3}"
      EVELAND_RELEASE_SWEEP_INTERVAL_MS: "${EVELAND_RELEASE_SWEEP_INTERVAL_MS:-3600000}"
      EVELAND_RELEASE_SWEEP_BATCH_SIZE: "${EVELAND_RELEASE_SWEEP_BATCH_SIZE:-25}"
      EVELAND_RELEASE_CHANNEL: "${EVELAND_RELEASE_CHANNEL:-stable}"
      EVELAND_REVISION: "${EVELAND_REVISION:-unknown}"
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/eveland:/var/lib/eveland
