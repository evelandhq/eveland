# Production overlay for a single-box (Linux) deployment. API/Agent Gateway/Dashboard run in
# Docker Compose; the worker and the workflow dispatcher run on the host as systemd services
# (infra/systemd/, see docs/en/production/core-services.md).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Set these in a local .env (gitignored) for the target environment:
#   DATABASE_URL=postgres://...                # the external platform database
#   EVELAND_WORKFLOW_WORLD_URL=postgres://...  # the external shared workflow database
#   EVELAND_PUBLIC_ORIGIN=https://your-host    # the single browser-visible origin (front door)
#   EVELAND_IDENTITY_ALLOWED_ORIGINS=https://your-chat-host  # only with an external chat frontend
#   BETTER_AUTH_SECRET=<long-random-secret>    # independent auth encryption/signing secret
# Better Auth URL, CORS origin, and the Identity issuer all derive from
# EVELAND_PUBLIC_ORIGIN unless individually overridden.
#
# Deployed agent data lives under /var/lib/eveland on the host, bind-mounted into the API at the
# same absolute path so database sourcePath values are valid in both places.
#
# Why Postgres is external: this form runs code in three network namespaces at once -- the Compose
# bridge (API), the host (Agent Gateway, Dashboard, worker, dispatcher) and every Deployment's own
# host process. A Compose-hosted database is dialable from all three only under three different
# addresses, so each database needed a per-namespace view and every consumer had to be told which
# view it held. An external Postgres has ONE address that resolves the same everywhere, which is
# the whole reason each database is a single DSN here. It must be reachable from the Compose
# bridge as written: a host-loopback address is the API container's own loopback, not the host's.
# See docs/en/production/prerequisites.md.
#
# Why host networking: production runs every Deployment as a host systemd process bound to the
# host's 127.0.0.1:PORT (loopback, not public), so the Agent Gateway (public proxy + internal
# Playground) reaches an Agent only by sharing the host's network. On host network the compose
# service DNS (api) is gone, so services talk over localhost. `ports: !override []` clears base
# published ports (incompatible with host net).
#
# Why the API is NOT on the host network: it dials no Deployment port (its only outbound call is
# the Gateway's cache invalidation), and the Collector must reach it to deliver every Agent event.
# On the bridge it keeps the base file's service DNS name for the Collector while publishing 17301
# to host loopback for the host-network Gateway and Dashboard, the host worker, and the dispatcher
# -- so the network contract holds (17301 loopback-only) and the Observation path stays connected.
# A host-network API can satisfy only one of the two.
#
# NODE_ENV=production is set only on the runtime command — setting it container-wide makes
# `pnpm install` skip devDependencies (tsx / the next build toolchain) and the stack fails to start.
services:
  otel-config-init:
    volumes: !override
      - ./infra/otel/collector.yaml:/seed/collector.yaml:ro
      - /var/lib/eveland/otel:/var/lib/eveland/otel

  otel-collector:
    restart: unless-stopped
    environment:
      EVELAND_OTLP_SERVICE_TOKEN: "${EVELAND_OTLP_SERVICE_TOKEN:?set EVELAND_OTLP_SERVICE_TOKEN}"
    volumes: !override
      - /var/lib/eveland/otel:/var/lib/eveland/otel:ro
      - eveland-otel-collector:/var/lib/otelcol

  postgres:
    # Production takes Postgres as an external prerequisite (see the header).
    # Gate the base file's development database behind a profile the production
    # command never enables, so the merged config cannot start one -- an
    # unnoticed second cluster is how a Deployment ends up writing runs the
    # dispatcher never claims.
    profiles: ["dev-postgres"]

  api:
    restart: unless-stopped
    # No network_mode/ports override: the API stays on the compose network and
    # keeps the base file's loopback publish (see the header).
    # The base file's dependency is on the profile-gated database above, which
    # is not part of this form at all; Compose rejects a merged config that
    # depends on a service no enabled profile defines.
    depends_on: !override
      - gateway
    command: sh -lc "apk add --no-cache unzip && corepack enable && pnpm install && cd apps/api && NODE_ENV=production pnpm exec tsx --import=@evelandhq/platform-observability/register --env-file=../../.env src/server.ts"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      CI: "true"
      EVELAND_PUBLIC_ORIGIN: "${EVELAND_PUBLIC_ORIGIN:?set EVELAND_PUBLIC_ORIGIN}"
      # The base file pins the development database by Compose service name;
      # this form has no such service. Required rather than defaulted: a
      # database address is an installation's own, and a wrong guess migrates
      # and serves a different cluster than the host processes use.
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL to the external platform database, dialable as written from the host and the Compose network alike}"
      EVELAND_DATA_DIR: /var/lib/eveland
      EVELAND_OTLP_SERVICE_TOKEN: "${EVELAND_OTLP_SERVICE_TOKEN:?set EVELAND_OTLP_SERVICE_TOKEN}"
      EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST: "${EVELAND_OBSERVABILITY_PRIVATE_ENDPOINT_ALLOWLIST:-}"
      # The front door is in the host namespace, so it has no service name here.
      EVELAND_GATEWAY_INTERNAL_URL: http://host.docker.internal:17300
      # The shared workflow database the worker, the dispatcher and every
      # Deployment use. One external address serves all of them, so the
      # platform-side view this variable exists to carry is that same value;
      # it is pinned here only to displace the base file's development literal.
      EVELAND_WORKFLOW_WORLD_BOOTSTRAP_URL: "${EVELAND_WORKFLOW_WORLD_URL:?set EVELAND_WORKFLOW_WORLD_URL to the external shared workflow database, dialable as written from the host and the Compose network alike}"
      EVELAND_GATEWAY_SERVICE_TOKEN: "${EVELAND_GATEWAY_SERVICE_TOKEN:?set EVELAND_GATEWAY_SERVICE_TOKEN}"
      EVELAND_ACTIVATION_LEASE_TTL_MS: "${EVELAND_ACTIVATION_LEASE_TTL_MS:-180000}"
      EVELAND_COLD_START_TIMEOUT_MS: "${EVELAND_COLD_START_TIMEOUT_MS:-30000}"
      EVELAND_GATEWAY_PUBLIC_SCHEME: https
      EVELAND_GATEWAY_PUBLIC_PORT: 0
      EVELAND_IDENTITY_ISSUER: "${EVELAND_IDENTITY_ISSUER:-}"
      EVELAND_IDENTITY_ALLOWED_ORIGINS: "${EVELAND_IDENTITY_ALLOWED_ORIGINS:-}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:?set APP_SECRET_KEY}"
      EVELAND_SCHEDULER_RUNTIME_SECRET: "${EVELAND_SCHEDULER_RUNTIME_SECRET:?set EVELAND_SCHEDULER_RUNTIME_SECRET}"
      EVELAND_SCHEDULER_DISPATCH_SECRET: "${EVELAND_SCHEDULER_DISPATCH_SECRET:?set EVELAND_SCHEDULER_DISPATCH_SECRET}"
      EVELAND_RELEASE_CHANNEL: "${EVELAND_RELEASE_CHANNEL:-stable}"
      EVELAND_REVISION: "${EVELAND_REVISION:-unknown}"
    volumes:
      - .:/workspace
      - /var/lib/eveland:/var/lib/eveland

  gateway:
    restart: unless-stopped
    network_mode: host
    ports: !override []
    # Same reason as the API above: the base file's dependency names the
    # profile-gated development database.
    depends_on: !override []
    command: sh -lc "corepack enable && pnpm install && cd apps/gateway && NODE_ENV=production pnpm exec tsx --import=@evelandhq/platform-observability/register --env-file=../../.env src/server.ts"
    environment:
      CI: "true"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL to the external platform database, dialable as written from the host and the Compose network alike}"
      GATEWAY_PORT: 17300
      EVELAND_AGENT_BASE_DOMAINS: "${EVELAND_AGENT_BASE_DOMAINS:?set EVELAND_AGENT_BASE_DOMAINS}"
      EVELAND_GATEWAY_SERVICE_TOKEN: "${EVELAND_GATEWAY_SERVICE_TOKEN:?set EVELAND_GATEWAY_SERVICE_TOKEN}"
      EVELAND_GATEWAY_AFFINITY_SECRET: "${EVELAND_GATEWAY_AFFINITY_SECRET:?set EVELAND_GATEWAY_AFFINITY_SECRET}"
      EVELAND_GATEWAY_MAX_REQUEST_BODY_BYTES: "${EVELAND_GATEWAY_MAX_REQUEST_BODY_BYTES:-10485760}"
      EVELAND_GATEWAY_PUBLIC_SCHEME: https
      EVELAND_API_INTERNAL_URL: http://127.0.0.1:17301
      # Host networking has no compose service DNS: the base file's
      # http://web:17302 front-door upstream must become loopback here too.
      EVELAND_WEB_INTERNAL_URL: http://127.0.0.1:17302
      EVELAND_OTLP_ENDPOINT: http://127.0.0.1:17312
      EVELAND_OTLP_SERVICE_TOKEN: "${EVELAND_OTLP_SERVICE_TOKEN:?set EVELAND_OTLP_SERVICE_TOKEN}"
      EVELAND_ACTIVATION_RENEW_INTERVAL_MS: "${EVELAND_ACTIVATION_RENEW_INTERVAL_MS:-60000}"
      EVELAND_RELEASE_CHANNEL: "${EVELAND_RELEASE_CHANNEL:-stable}"
      EVELAND_REVISION: "${EVELAND_REVISION:-unknown}"

  workflow-dispatcher:
    # Exactly one dispatcher may drive the production shared workflow database:
    # the host systemd service (docs/en/production/workflow-dispatcher.md). Gate
    # the base file's development dispatcher behind a profile the production
    # command never enables so the merged config cannot start a second one.
    profiles: ["dev-dispatcher"]

  web:
    restart: unless-stopped
    network_mode: host
    ports: !override []
    command: sh -lc "corepack enable && pnpm install && NODE_ENV=production pnpm --filter @evelandhq/web build && NODE_ENV=production pnpm --filter @evelandhq/web exec next start --port 17302 --hostname 127.0.0.1"
    environment:
      CI: "true"
      API_URL: http://localhost:17301
      EVELAND_RELEASE_CHANNEL: "${EVELAND_RELEASE_CHANNEL:-stable}"
      EVELAND_REVISION: "${EVELAND_REVISION:-unknown}"

  worker:
    # Production runs the host systemd Worker (docs/en/production/worker.md).
    # Gate the base file's development Worker behind a profile the production
    # command never enables so the merged config cannot start a second one.
    profiles: ["dev-worker"]
