<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Eveland GitHub social preview</title>
  <desc id="description">Eveland is self-hosted production infrastructure for Eve agent fleets.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="1" stop-color="#11100f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5c35" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff5c35" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1080" cy="100" r="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#ff5c35"/>

  <g transform="translate(80 72)">
    <rect width="58" height="58" rx="13" fill="#ffffff"/>
    <path d="M13 12h34v10H23v8h20v9H23v7h24v10H13z" fill="#080808"/>
    <circle cx="43" cy="17" r="4.5" fill="#ff5c35"/>
    <text x="78" y="44" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="700" letter-spacing="8">EVELAND</text>
  </g>

  <g transform="translate(80 220)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text fill="#ffffff" font-size="64" font-weight="650" letter-spacing="-2">
      <tspan x="0" y="0">Production infrastructure</tspan>
      <tspan x="0" y="76">for Eve agent fleets.</tspan>
    </text>
    <text x="0" y="158" fill="#a9a7a4" font-size="27" font-weight="450">
      Deploy · Route · Schedule · Observe
    </text>
    <g transform="translate(0 207)">
      <rect width="360" height="48" rx="24" fill="#191816" stroke="#373431"/>
      <circle cx="25" cy="24" r="6" fill="#ff5c35"/>
      <text x="43" y="31" fill="#e7e4e0" font-size="20" font-weight="560">ON YOUR INFRASTRUCTURE</text>
    </g>
  </g>

  <g transform="translate(830 92)" filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="360" height="460" rx="30" fill="#121211" stroke="#34312f" stroke-width="2"/>
    <text x="30" y="46" fill="#817e7a" font-size="15" font-weight="650" letter-spacing="3">RELEASE FLOW</text>
    <circle cx="320" cy="38" r="7" fill="#36b37e"/>

    <g transform="translate(30 76)">
      <rect width="300" height="66" rx="14" fill="#1b1a18" stroke="#3a3734"/>
      <text x="24" y="27" fill="#8d8985" font-size="13" font-weight="650" letter-spacing="2">01</text>
      <text x="24" y="50" fill="#ffffff" font-size="23" font-weight="600">Import</text>
      <path d="M256 33h18m-7-7 7 7-7 7" fill="none" stroke="#77726d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(30 157)">
      <rect width="300" height="66" rx="14" fill="#1b1a18" stroke="#3a3734"/>
      <text x="24" y="27" fill="#8d8985" font-size="13" font-weight="650" letter-spacing="2">02</text>
      <text x="24" y="50" fill="#ffffff" font-size="23" font-weight="600">Preview</text>
      <rect x="232" y="20" width="44" height="26" rx="13" fill="#242220"/>
      <circle cx="245" cy="33" r="6" fill="#ffb020"/>
      <text x="256" y="37" fill="#d0cbc5" font-size="11">ON</text>
    </g>
    <g transform="translate(30 238)">
      <rect width="300" height="66" rx="14" fill="#241713" stroke="#813a27"/>
      <text x="24" y="27" fill="#d27c63" font-size="13" font-weight="650" letter-spacing="2">03</text>
      <text x="24" y="50" fill="#ffffff" font-size="23" font-weight="600">Promote</text>
      <circle cx="264" cy="33" r="12" fill="#ff5c35"/>
      <path d="m258 33 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(30 319)">
      <rect width="300" height="66" rx="14" fill="#1b1a18" stroke="#3a3734"/>
      <text x="24" y="27" fill="#8d8985" font-size="13" font-weight="650" letter-spacing="2">04</text>
      <text x="24" y="50" fill="#ffffff" font-size="23" font-weight="600">Observe</text>
      <path d="M231 40V29m13 11V22m13 18V31m13 9V18" fill="none" stroke="#ff5c35" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="30" y="430" fill="#77736f" font-size="14">Immutable releases · Stable routes</text>
  </g>
</svg>
