name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            command: pnpm --filter @eveland/api test
          - name: worker
            command: pnpm --filter @eveland/worker test
          - name: db
            command: pnpm --filter @eveland/db test
          - name: remaining
            command: pnpm --filter='!@eveland/api' --filter='!@eveland/worker' --filter='!@eveland/db' -r test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eveland
          POSTGRES_PASSWORD: eveland
          POSTGRES_DB: eveland_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eveland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVELAND_POSTGRES_TEST_URL: postgres://eveland:eveland@localhost:5432/eveland_test
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Twice on purpose: the second run must be a no-op, proving the
      # migration journal stays re-applicable against an already-migrated
      # database (the path production upgrades take).
      - name: Apply database migrations (twice, verifying idempotent re-run)
        run: |
          pnpm --filter @eveland/db db:migrate
          pnpm --filter @eveland/db db:migrate
        env:
          DATABASE_URL: postgres://eveland:eveland@localhost:5432/eveland_test

      - name: Run tests
        run: ${{ matrix.command }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore web build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-web-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.js', 'apps/web/**/*.jsx', 'apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css', 'apps/web/**/*.json', 'packages/core/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-web-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Restore docs build cache
        uses: actions/cache@v4
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-next-docs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**/*.js', 'apps/docs/**/*.mjs', 'apps/docs/**/*.ts', 'apps/docs/**/*.tsx', 'apps/docs/**/*.css', 'apps/docs/**/*.json', 'apps/docs/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-next-docs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm --filter @eveland/sandbox-bwrap --filter @eveland/docs --filter @eveland/web -r build
