name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/worker resolves @eveland/sandbox-bwrap's built dist/ via
      # node's module resolution at runtime (see runtime/select.ts),
      # not just its TS types, so its tests need dist/ to exist even
      # though dist/ is gitignored and no other test in this workspace
      # requires a sibling package to be pre-built.
      - name: Build @eveland/sandbox-bwrap
        run: pnpm --filter @eveland/sandbox-bwrap build

      - name: Run tests
        run: pnpm -r test
