name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `--range` walks the pushed commits; a shallow clone may not have them.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory: the squash message is composed at merge time and the merge
      # dialog can still edit it. Titles reach the script through the
      # environment, never through shell interpolation.
      - name: Check the pull request title and description
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-commit-messages.mjs --pull-request

      # Authoritative: these are the messages Release Please will read.
      - name: Check the commits pushed to main
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: node scripts/check-commit-messages.mjs --range "$PUSH_BEFORE..$PUSH_AFTER"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm fmt:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            command: pnpm --filter @evelandhq/api test
          - name: worker
            command: pnpm --filter @evelandhq/worker test
          - name: db
            command: pnpm --filter @evelandhq/db test
          - name: remaining
            command: pnpm --filter='!@evelandhq/api' --filter='!@evelandhq/worker' --filter='!@evelandhq/db' -r test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eveland
          POSTGRES_PASSWORD: eveland
          POSTGRES_DB: eveland_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eveland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVELAND_POSTGRES_TEST_URL: postgres://eveland:eveland@localhost:5432/eveland_test
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Twice on purpose: the second run must be a no-op, proving the
      # migration journal stays re-applicable against an already-migrated
      # database (the path production upgrades take).
      - name: Apply database migrations (twice, verifying idempotent re-run)
        run: |
          pnpm --filter @evelandhq/db db:migrate
          pnpm --filter @evelandhq/db db:migrate
        env:
          DATABASE_URL: postgres://eveland:eveland@localhost:5432/eveland_test

      - name: Run tests
        run: ${{ matrix.command }}

  sdk:
    name: SDK pack contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The published package must stay installable straight from a registry
      # tarball: prepack builds dist, then the tarball is installed into a
      # clean project (the eve peer resolves from npm) and imported.
      - name: Pack the sdk
        run: pnpm --filter eveland pack --pack-destination /tmp/eveland-sdk

      - name: Install the tarball into a clean project and import it
        run: |
          mkdir -p /tmp/sdk-smoke && cd /tmp/sdk-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund /tmp/eveland-sdk/eveland-*.tgz
          node -e "import('eveland/auth').then((m) => { if (typeof m.evelandIdentity !== 'function') throw new Error('evelandIdentity export missing'); console.log('sdk auth import ok'); })"
          node -e "import('eveland/memory').then((m) => { if (typeof m.evelandMemoryBackend !== 'function') throw new Error('evelandMemoryBackend export missing'); console.log('sdk memory import ok'); })"

  native-linux-observation:
    name: Linux native Observation path
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eveland
          POSTGRES_PASSWORD: eveland
          POSTGRES_DB: eveland_native
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eveland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://eveland:eveland@127.0.0.1:5432/eveland_native
      # Exactly 32 bytes: assertValidSecretKey rejects any other length.
      APP_SECRET_KEY: eveland-native-smoke-secret-0000
      BETTER_AUTH_SECRET: eveland-native-smoke-better-auth-secret
      EVELAND_ADMIN_PASSWORD: eveland_native_password
      EVELAND_OTLP_SERVICE_TOKEN: eveland-native-smoke-otlp-token
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @evelandhq/db db:migrate

      - name: Prove the bridged Collector reaches the host API
        run: |
          bridge_host="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          export EVELAND_API_DOCKER_BRIDGE_HOST="$bridge_host"
          compose=(docker compose -f docker-compose.yml -f docker-compose.native-linux.yml)
          api_log="$RUNNER_TEMP/eveland-native-api.log"
          api_pid=""
          cleanup() {
            if [ -n "$api_pid" ]; then kill "$api_pid" 2>/dev/null || true; fi
            "${compose[@]}" down --volumes 2>/dev/null || true
          }
          trap cleanup EXIT

          "${compose[@]}" up -d otel-collector
          pnpm --filter @evelandhq/api exec tsx src/server.ts >"$api_log" 2>&1 &
          api_pid="$!"

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:17301/health >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat "$api_log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:17301/health >/dev/null

          collector_network="$(docker inspect eveland-otel-collector \
            --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          docker run --rm --network "$collector_network" \
            --add-host host.docker.internal:host-gateway \
            curlimages/curl:8.11.1 -fsS \
            -H "Authorization: Bearer $EVELAND_OTLP_SERVICE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"resourceLogs":[]}' \
            http://host.docker.internal:17301/internal/otel/v1/logs >/dev/null

          docker run --rm --network "$collector_network" \
            --add-host host.docker.internal:host-gateway \
            curlimages/curl:8.11.1 -fsS \
            http://host.docker.internal:17301/.well-known/jwks.json >/dev/null

          status="$(docker run --rm --network "$collector_network" \
            --add-host host.docker.internal:host-gateway \
            curlimages/curl:8.11.1 -sS -o /dev/null -w '%{http_code}' \
            http://host.docker.internal:17301/api/projects)"
          test "$status" = "404"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore web build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-web-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.js', 'apps/web/**/*.jsx', 'apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css', 'apps/web/**/*.json', 'packages/core/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-web-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Restore docs build cache
        uses: actions/cache@v6
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-next-docs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**/*.js', 'apps/docs/**/*.mjs', 'apps/docs/**/*.ts', 'apps/docs/**/*.tsx', 'apps/docs/**/*.css', 'apps/docs/**/*.json', 'apps/docs/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-next-docs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm --filter @evelandhq/docs --filter @evelandhq/web -r build
