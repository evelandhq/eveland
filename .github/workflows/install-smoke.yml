name: install smoke

# The one-line installer's real-machine gate: a fresh Ubuntu runner (a full
# systemd VM) runs install.sh non-interactively from this very checkout with
# no pre-provisioning beyond the external Postgres this topology takes as a
# prerequisite — the installer and the ctl bootstrap own the rest of the host
# contract themselves (Node resolution, sandbox toolchain via apt, bwrap
# AppArmor profile, service users, /workspace, system-PATH toolchain). The run
# must end with doctor green, working implicit login, a seeded built-in agent
# path, and a clean stop.
#
# Runs nightly, on demand, and on PRs that touch the installer surface.

on:
  workflow_dispatch:
  schedule:
    - cron: "42 3 * * *"
  pull_request:
    paths:
      - apps/docs/public/install.sh
      - apps/docs/public/install.sh.sha256
      - docker-compose.yml
      - docker-compose.prod.yml
      - infra/otel/collector.yaml
      - packages/ctl/**
      - .github/workflows/install-smoke.yml

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth 0: the installer clones from this workspace, and a local
      # clone of a shallow repository is refused by git.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free runner disk
        run: |
          # Runner-image housekeeping, not product logic: the preloaded
          # toolchains leave too little disk for a full appliance (host
          # install + three container installs + images + agent builds).
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost || true
          df -h / | tail -1

      - name: Make the runner a genuinely fresh host
        run: |
          # The image ships Docker CE; a fresh Ubuntu does not. Remove it so
          # the installer's own base-prerequisite step (git/curl/docker.io)
          # is exercised for real, not skipped because Docker was pre-baked.
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo apt-get remove -y -qq docker-ce docker-ce-cli docker-ce-rootless-extras docker-buildx-plugin docker-compose-plugin containerd.io moby-engine moby-cli moby-compose moby-containerd 2>/dev/null || true
          sudo apt-get remove -y -qq docker-compose-v2 docker-compose 2>/dev/null || true
          sudo rm -f /usr/bin/docker /usr/local/bin/docker /usr/bin/docker-compose /usr/local/bin/docker-compose
          # Compose v2 is a CLI plugin: a bare Ubuntu has none of these dirs.
          sudo rm -rf /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins /usr/lib/docker/cli-plugins "$HOME/.docker/cli-plugins" /root/.docker/cli-plugins
          if command -v docker >/dev/null 2>&1; then echo "docker still present: $(command -v docker)"; exit 1; fi
          for plugin in /usr/libexec/docker/cli-plugins/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose /usr/lib/docker/cli-plugins/docker-compose; do
            if [ -e "$plugin" ]; then echo "compose plugin still present: $plugin"; exit 1; fi
          done

      - name: Provision the external Postgres the production form requires
        run: |
          # Production runs code in three network namespaces at once — the
          # Compose bridge (API), the host (Gateway, Dashboard, Worker,
          # dispatcher) and every Deployment — so the database it dials has
          # to sit outside the installation, under one address that resolves
          # the same in all three. Here the runner plays that external host.
          # It ships PostgreSQL but leaves the service stopped and bound to
          # loopback, which is the container's own loopback inside the API.
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          read -r version cluster port < <(pg_lsclusters -h | awk 'NR==1 {print $1, $2, $3}')
          sudo pg_conftool "$version" "$cluster" set listen_addresses '*'
          # Docker is not installed yet, so its bridges have no addresses to
          # name here; admit the private ranges they will be numbered from.
          printf '%s\n' \
            'host all all 10.0.0.0/8 scram-sha-256' \
            'host all all 172.16.0.0/12 scram-sha-256' \
            'host all all 192.168.0.0/16 scram-sha-256' \
            | sudo tee -a "/etc/postgresql/$version/$cluster/pg_hba.conf" >/dev/null
          sudo pg_ctlcluster "$version" "$cluster" stop || true
          sudo pg_ctlcluster "$version" "$cluster" start
          # Exactly what docs/en/production/prerequisites.md asks an operator
          # for: two databases owned by one role, and no CREATEDB — a Project
          # is a tenant partition inside the shared World, not a database.
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          create role eveland login password 'eveland';
          create database eveland owner eveland;
          create database eveland_workflow owner eveland;
          SQL
          host=$(ip -4 route get 1.1.1.1 | awk '{print $7; exit}')
          echo "EVELAND_SMOKE_DB_ADDR=$host:$port" >> "$GITHUB_ENV"

      - name: Run the installer non-interactively
        run: |
          # Root installs to /opt/eveland exactly like a real Linux box; the
          # checkout is cloned locally at this PR's merge commit instead of
          # the newest release tag. `safe.directory` lets root read the
          # runner-owned workspace. Deliberately NO setup-node / pnpm /
          # apt steps here: resolving Node (the runner's is < 24, so the
          # tarball tier runs) and provisioning the host is the product's
          # own job. Both DSNs are exported because a non-interactive Linux
          # install has no one to ask, and ctl invents neither.
          sudo git config --global --add safe.directory '*'
          sudo -E env "PATH=$PATH" \
            EVELAND_REPO_URL="$GITHUB_WORKSPACE" \
            EVELAND_VERSION="$GITHUB_SHA" \
            DATABASE_URL="postgres://eveland:eveland@${EVELAND_SMOKE_DB_ADDR}/eveland" \
            EVELAND_WORKFLOW_WORLD_URL="postgres://eveland:eveland@${EVELAND_SMOKE_DB_ADDR}/eveland_workflow" \
            bash apps/docs/public/install.sh --no-prompt

      - name: Doctor must be green
        run: |
          sudo -E env "PATH=$PATH" EVELAND_HOME=/opt/eveland /opt/eveland/bin/eveland-ctl doctor

      - name: Status must be healthy
        run: |
          sudo -E env "PATH=$PATH" EVELAND_HOME=/opt/eveland /opt/eveland/bin/eveland-ctl status

      - name: Implicit CLI login works
        run: |
          sudo -E env "PATH=$PATH" EVELAND_HOME=/opt/eveland /opt/eveland/bin/eveland whoami

      - name: Front door answers
        run: |
          curl -fsS http://localhost:17300/health
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:17300/

      - name: Collector can reach the API
        run: |
          sudo docker run --rm --network container:eveland-otel-collector \
            curlimages/curl:8.11.1 -fsS -o /dev/null http://api:17301/health

      - name: Stop cleanly
        run: |
          sudo -E env "PATH=$PATH" EVELAND_HOME=/opt/eveland /opt/eveland/bin/eveland-ctl stop

      - name: Surface platform logs on failure
        if: failure()
        run: |
          sudo tail -n 100 /opt/eveland/logs/*.log || true
          sudo tail -n 50 /opt/eveland/logs/install.log || true
          sudo journalctl -u eveland-worker -u eveland-workflow-dispatcher -n 120 --no-pager || true
          cd /opt/eveland/source || exit 0
          COMPOSE="sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml -f /opt/eveland/etc/compose.appliance.yml --env-file /opt/eveland/etc/eveland.env"
          $COMPOSE ps || true
          $COMPOSE logs --tail 80 api gateway web otel-collector || true
          sudo tail -n 80 /var/log/postgresql/*.log || true
