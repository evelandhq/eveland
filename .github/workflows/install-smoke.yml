name: install smoke

# The one-line installer's real-machine gate: a fresh Ubuntu runner (a full
# systemd VM) runs install.sh non-interactively from this very checkout with
# NO pre-provisioning beyond what any GitHub runner ships — the installer and
# the ctl bootstrap own the whole host contract themselves (Node resolution,
# sandbox toolchain via apt, bwrap AppArmor profile, service users,
# /workspace, system-PATH toolchain). The run must end with doctor green,
# working implicit login, a seeded built-in agent path, and a clean stop.
#
# Runs nightly, on demand, and on PRs that touch the installer surface.

on:
  workflow_dispatch:
  schedule:
    - cron: "42 3 * * *"
  pull_request:
    paths:
      - apps/docs/public/install.sh
      - apps/docs/public/install.sh.sha256
      - docker-compose.yml
      - docker-compose.prod.yml
      - infra/otel/collector.yaml
      - packages/ctl/**
      - .github/workflows/install-smoke.yml

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth 0: the installer clones from this workspace, and a local
      # clone of a shallow repository is refused by git.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free runner disk
        run: |
          # Runner-image housekeeping, not product logic: the preloaded
          # toolchains leave too little disk for a full appliance (host
          # install + three container installs + images + agent builds).
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost || true
          df -h / | tail -1

      - name: Make the runner a genuinely fresh host
        run: |
          # The image ships Docker CE; a fresh Ubuntu does not. Remove it so
          # the installer's own base-prerequisite step (git/curl/docker.io)
          # is exercised for real, not skipped because Docker was pre-baked.
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo apt-get remove -y -qq docker-ce docker-ce-cli docker-ce-rootless-extras docker-buildx-plugin docker-compose-plugin containerd.io moby-engine moby-cli moby-compose moby-containerd 2>/dev/null || true
          sudo apt-get remove -y -qq docker-compose-v2 docker-compose 2>/dev/null || true
          sudo rm -f /usr/bin/docker /usr/local/bin/docker /usr/bin/docker-compose /usr/local/bin/docker-compose
          # Compose v2 is a CLI plugin: a bare Ubuntu has none of these dirs.
          sudo rm -rf /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins /usr/lib/docker/cli-plugins "$HOME/.docker/cli-plugins" /root/.docker/cli-plugins
          if command -v docker >/dev/null 2>&1; then echo "docker still present: $(command -v docker)"; exit 1; fi
          for plugin in /usr/libexec/docker/cli-plugins/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose /usr/lib/docker/cli-plugins/docker-compose; do
            if [ -e "$plugin" ]; then echo "compose plugin still present: $plugin"; exit 1; fi
          done

      - name: Run the installer non-interactively
        run: |
          # Root installs to /opt/eveland exactly like a real Linux box; the
          # checkout is cloned locally at this PR's merge commit instead of
          # the newest release tag. `safe.directory` lets root read the
          # runner-owned workspace. Deliberately NO setup-node / pnpm /
          # apt steps here: resolving Node (the runner's is < 24, so the
          # tarball tier runs) and provisioning the host is the product's
          # own job.
          sudo git config --global --add safe.directory '*'
          sudo -E env "PATH=$PATH" \
            EVELAND_REPO_URL="$GITHUB_WORKSPACE" \
            EVELAND_VERSION="$GITHUB_SHA" \
            bash apps/docs/public/install.sh --no-prompt

      - name: The rendered units must be valid systemd
        # systemd ignores unknown keys with only a log line, so a directive in
        # the wrong section (StartLimit* belongs to [Unit], not [Service])
        # silently does nothing. `verify` is the only thing that says so.
        # It reports the units' ExecStart binaries as unreadable when run
        # unprivileged, hence sudo.
        run: |
          sudo systemd-analyze verify \
            /etc/systemd/system/eveland-api.service \
            /etc/systemd/system/eveland-gateway.service \
            /etc/systemd/system/eveland-web.service \
            /etc/systemd/system/eveland-worker.service \
            /etc/systemd/system/eveland-workflow-dispatcher.service

      - name: Each platform service has its own uid
        # The per-service env allowlists are only a boundary if no two
        # services share a uid: same-uid processes read each other's
        # /proc/<pid>/environ.
        run: |
          users="$(sudo sed -n 's/^User=//p' /etc/systemd/system/eveland-*.service | sort)"
          echo "$users"
          test "$(echo "$users" | wc -l)" = "$(echo "$users" | uniq | wc -l)"
          sudo grep -q '^DynamicUser=yes' /etc/systemd/system/eveland-gateway.service

      - name: Doctor must be green
        run: |
          sudo -E env "PATH=$PATH" EVELAND_HOME=/opt/eveland /opt/eveland/bin/eveland-ctl doctor

      - name: Status must be healthy
        run: |
          sudo -E env "PATH=$PATH" EVELAND_HOME=/opt/eveland /opt/eveland/bin/eveland-ctl status

      - name: Implicit CLI login works
        run: |
          sudo -E env "PATH=$PATH" EVELAND_HOME=/opt/eveland /opt/eveland/bin/eveland whoami

      - name: Front door answers
        run: |
          curl -fsS http://localhost:17300/health
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:17300/

      - name: Collector can reach the API, and only on the allowlisted paths
        # The API is a host process now, so the Collector reaches it at the
        # bridge address eveland-ctl detected -- which is what this probes,
        # rather than a name it would have to trust Docker to inject
        # (`--add-host` is rejected outright alongside `--network container:`).
        # Both halves matter: the runtime path answers, and the control plane
        # is not served there at all.
        run: |
          BRIDGE="$(sudo sed -n 's/^EVELAND_API_DOCKER_BRIDGE_HOST=//p' /opt/eveland/etc/eveland-api.env)"
          test -n "$BRIDGE"
          echo "detected bridge address: $BRIDGE"
          sudo docker run --rm --network container:eveland-otel-collector \
            curlimages/curl:8.11.1 -fsS -o /dev/null "http://$BRIDGE:17301/health"
          code="$(sudo docker run --rm --network container:eveland-otel-collector \
            curlimages/curl:8.11.1 -s -o /dev/null -w '%{http_code}' \
            "http://$BRIDGE:17301/api/projects")"
          echo "control plane through the bridge listener: $code"
          test "$code" = 404

      - name: Agent telemetry actually landed
        # The Observation path end to end, not just its last hop: the host
        # worker exports host metrics over OTLP, the bridged Collector
        # forwards them to the API, and the API projects them into Postgres.
        # A silently disconnected Collector fills its queue and looks healthy.
        run: |
          # The ctl's own three-file stack from the ctl's own source tree: a
          # bare `docker compose` here would resolve a different project (the
          # runner workspace) and find no such service.
          cd /opt/eveland/source
          sudo docker compose \
            -f docker-compose.yml -f docker-compose.prod.yml \
            -f /opt/eveland/etc/compose.appliance.yml \
            --env-file /opt/eveland/etc/eveland.env --profile bundled-postgres \
            exec -T postgres psql -U eveland -d eveland -tAc \
            "select count(*) from host_metric_samples where observed_at > now() - interval '10 minutes'" \
            | tee /tmp/samples
          test "$(tr -d '[:space:]' < /tmp/samples)" -gt 0

      - name: Stop cleanly
        run: |
          sudo -E env "PATH=$PATH" EVELAND_HOME=/opt/eveland /opt/eveland/bin/eveland-ctl stop

      - name: Surface platform logs on failure
        if: failure()
        run: |
          sudo tail -n 100 /opt/eveland/logs/*.log || true
          sudo tail -n 50 /opt/eveland/logs/install.log || true
          sudo journalctl -u eveland-api -u eveland-gateway -u eveland-web \
            -u eveland-worker -u eveland-workflow-dispatcher -n 200 --no-pager || true
          cd /opt/eveland/source || exit 0
          COMPOSE="sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml -f /opt/eveland/etc/compose.appliance.yml --env-file /opt/eveland/etc/eveland.env --profile bundled-postgres"
          $COMPOSE ps || true
          $COMPOSE logs --tail 80 postgres otel-collector || true
