name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore docs build cache
        uses: actions/cache@v4
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-next-docs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**/*.js', 'apps/docs/**/*.mjs', 'apps/docs/**/*.ts', 'apps/docs/**/*.tsx', 'apps/docs/**/*.css', 'apps/docs/**/*.json', 'docs/**/*.md', 'docs/**/*.json', 'docs/**/*.svg') }}
          restore-keys: |
            ${{ runner.os }}-next-docs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build Cloudflare Worker
        run: pnpm --filter @evelandhq/docs build:cloudflare

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy
          packageManager: pnpm
