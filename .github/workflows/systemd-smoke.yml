name: systemd smoke

# The production worker topology (systemd + bwrap sandbox) previously had no
# automated coverage at all -- only the manual Lima harness in
# infra/integration/run.sh. This is the reduced version of that harness on a
# plain ubuntu runner (a full systemd VM): preflight, the worker systemd
# smoke, the end-to-end sandbox proof, and the gateway e2e against the real
# systemd runtime. The Lima script remains the
# full-fidelity harness (observer/connections/schedule e2e stay there; the
# schedule e2e carries a known upstream replay flake that would poison a
# nightly signal).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: systemd-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The external-only cutover made every new Release a shared-World build:
      # deployments crash at boot without an injected WORKFLOW_WORLD_URL. Same
      # throwaway single-host database the Lima guest provisions
      # (infra/integration/run.sh); `sudo -E` carries it into every worker
      # step below.
      EVELAND_WORKFLOW_WORLD_URL: postgres://eveland:eveland@127.0.0.1:5432/eveland_workflow
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install sandbox host dependencies
        run: |
          sudo apt-get update
          # Parity with the Lima guest's provisioning list (infra/integration/run.sh),
          # minus docker.io: the worker preflight requires e.g. ripgrep on PATH.
          sudo apt-get install -y apparmor bash bubblewrap ca-certificates curl findutils git grep jq openssl postgresql python-is-python3 python3 python3-pip ripgrep unzip zstd
          # bwrap binds /workspace as the sandbox workspace destination and
          # cannot create it itself.
          sudo mkdir -p /workspace
          # ubuntu-24.04 runners restrict unprivileged user namespaces via
          # AppArmor, and the build sandbox runs bwrap as the unprivileged
          # eveland-build user. The runner VM is ephemeral, so lifting the
          # restriction mirrors the Lima guest instead of weakening a durable
          # host.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Put the sandbox toolchain on the system PATH
        run: |
          # Deployment units run with a plain system PATH, so the toolchain the
          # sandbox self-check probes must live there -- not in the runner's
          # per-user setup-pnpm/setup-node directories. Same corepack install
          # the Lima guest performs.
          sudo corepack enable
          sudo corepack install --global pnpm@11.7.0
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo ln -sf "$(command -v npm)" /usr/local/bin/npm
          sudo -i sh -lc 'command -v node npm pnpm rg jq zstd'

      - name: Provision worker users and data root
        run: |
          id -u eveland-build >/dev/null 2>&1 || sudo useradd --system --home-dir /var/lib/eveland-build --create-home eveland-build
          id -u eveland-app >/dev/null 2>&1 || sudo useradd --system --home-dir /var/lib/eveland-app --create-home eveland-app
          sudo install -d /var/lib/eveland-data
          # The deployment-shaped unit runs as the unprivileged eveland-app and
          # must reach the checkout. The runner's home is not world-traversable,
          # unlike the Lima guest's /opt/eveland. Grant traverse on the
          # ancestors only (contents keep their checkout permissions).
          sudo chmod o+x /home/runner /home/runner/work "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

      - name: Provision the shared workflow world database
        run: |
          # Same role/database the Lima guest creates: the worker injects
          # EVELAND_WORKFLOW_WORLD_URL (job env above) into every Release it
          # builds, and the deployed server refuses to boot without it. The
          # runner image ships PostgreSQL but leaves the service stopped.
          sudo systemctl start postgresql
          sudo -u postgres createuser --createdb eveland 2>/dev/null || true
          sudo -u postgres psql -c "alter role eveland with login password \$\$eveland\$\$"
          sudo -u postgres createdb -O eveland eveland_workflow 2>/dev/null || true

      - name: Worker preflight
        run: |
          sudo -E env "PATH=$PATH" \
            EVELAND_RUNTIME=systemd EVELAND_BUILD_SANDBOX=bwrap EVELAND_DATA_DIR=/var/lib/eveland-data \
            pnpm --filter @evelandhq/worker exec tsx src/integration/preflight-check.ts

      - name: Worker systemd smoke
        run: |
          sudo -E env "PATH=$PATH" \
            EVELAND_RUNTIME=systemd EVELAND_BUILD_SANDBOX=bwrap EVELAND_DATA_DIR=/var/lib/eveland-data \
            pnpm --filter @evelandhq/worker exec tsx src/integration/systemd-smoke.ts

      # The bwrap backend's own contract test used to run here, when the backend was
      # a workspace package. It now ships from evelandhq/sandbox-bwrap, which runs it
      # in its own CI and, under these same systemd constraints, via that repo's
      # infra/smoke.sh. What Eveland still owns is the integration below: that an
      # imported project gets a working sandbox it never declared, exercised against
      # the vendored backend under the real systemd runtime.

      - name: Agent sandbox end-to-end
        run: |
          sudo -E env "PATH=$PATH" \
            EVELAND_RUNTIME=systemd EVELAND_BUILD_SANDBOX=bwrap EVELAND_DATA_DIR=/var/lib/eveland-data \
            pnpm --filter @evelandhq/worker exec tsx src/integration/agent-sandbox-e2e.ts

      - name: Gateway e2e against the systemd runtime
        run: |
          sudo -E env "PATH=$PATH" \
            EVELAND_RUNTIME=systemd EVELAND_BUILD_SANDBOX=bwrap \
            EVELAND_DATA_DIR=/var/lib/eveland-data EVELAND_AGENT_BASE_DOMAINS=agent.localhost \
            pnpm exec tsx infra/integration/gateway-e2e.mts
