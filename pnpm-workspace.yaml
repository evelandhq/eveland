packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  cbor-extract: true
  esbuild: true
  sharp: true
  workerd: true
# The workspace and real fixtures pin the verified Eve 0.24.6 patch, while
# imported Agents may use the supported 0.24.x line. Waive the release-age
# cooldown only for this explicitly reviewed package.
minimumReleaseAgeExclude:
  - eve
