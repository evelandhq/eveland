packages:
  - "apps/*"
  - "packages/*"
catalog:
  eve: 0.30.6
catalogs:
  eve-matrix:
    eve-oldest: npm:eve@0.28.0
    eve-middle: npm:eve@0.29.5
  eve-peer:
    eve: ">=0.28.0 <0.31.0"
  # The published SDK's contract is narrower than the platform's. It imports
  # four primitives from eve/channels/auth, stable across 0.27-0.30, while
  # eve-peer tracks what Eveland can actually host and slides every minor.
  # Tying the SDK to that forced a republish per slide and left consumers on a
  # newer eve with a spurious peer warning in between. The floor still follows
  # the window; only the ceiling is independent.
  eve-sdk-peer:
    eve: ">=0.28.0 <1.0.0"
allowBuilds:
  cbor-extract: true
  esbuild: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  workerd: true
overrides:
  "react-jsx-parser>@types/react": 19.2.17
  "react-jsx-parser>@types/react-dom": 19.2.3
# The Eve catalogs are a package-manager projection of the browser-safe policy
# in packages/core/src/eve-compatibility.ts. Imported Agents may use any
# verified minor in the three-version window. Waive the release-age cooldown
# only for this explicitly reviewed package.
minimumReleaseAgeExclude:
  - eve
  - "@ai-sdk/gateway@4.0.33"
  - "@ai-sdk/provider-utils@5.0.16"
  - ai@7.0.44
