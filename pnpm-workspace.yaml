packages:
  - "apps/*"
  - "packages/*"
catalog:
  eve: 1.0.0
allowBuilds:
  cbor-extract: true
  esbuild: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  workerd: true
overrides:
  # Security floors for transitive deps whose parents pin vulnerable versions
  # exactly (Dependabot alerts, 2026-08-24). Drop each once the parent moves:
  # miniflare pins sharp/undici exactly per release; drizzle-kit's deprecated
  # @esbuild-kit chain pins esbuild ~0.18.
  # sharp floor raised to 0.35.4 for GHSA-rgj7-g3m4-5g8c (libheif), 2026-09-15.
  "miniflare>sharp": "^0.35.4"
  "miniflare>undici": "^7.30.1"
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  # Security floors for high/critical Dependabot alerts, 2026-11-15. Each
  # parent still allows (or pins) a vulnerable patch; drop a floor once every
  # parent resolves past it. dompurify via mermaid (GHSA-cg2g-xh64-v4q7);
  # undici 7 via the legacy world-local, @ai-sdk/provider-utils, dotenvx and
  # world-local 5.2.1, undici 8 via jsdom and node-gyp (GHSA-xjj6-f33q-929c and
  # siblings); systeminformation via host-metrics and dotenvx
  # (GHSA-3f7j-7jwc-fxfj); zod 4 via the Workflow worlds and
  # @vercel/cli-config (GHSA-mrhx-c7xc-m3w5). vite, which vitest takes as a
  # peer, is floored by the root devDependency instead (GHSA-587h-7wmj-h5pm).
  "dompurify@<3.4.17": "^3.4.17"
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  "undici@>=8.0.0 <8.12.2": "^8.12.4"
  "systeminformation@<5.33.16": "^5.33.16"
  "zod@>=4.0.0 <4.6.6": "^4.6.7"
peerDependencyRules:
  allowedVersions:
    # @pierre/trees 1.0.0-beta.6 (still the latest) pins @pierre/theming 1.0.0,
    # whose peer range predates @pierre/theme 2.0 that @pierre/diffs 1.3+ pins.
    # theming only lazy-imports the ten `@pierre/theme/pierre-*` subpaths, and
    # theme 2.0 still exports every one of them (theming 1.0.1 widened its own
    # range to ^1.1.0 || ^2.0.0). Drop this once trees moves to theming 1.0.1+.
    "@pierre/theming@1.0.0>@pierre/theme": "2"
# The `eve` catalog entry is the verified eve (VERIFIED_EVE_VERSION in
# packages/core/src/eve-compatibility.ts); the compatibility ratchet keeps the
# two equal.
#
# The release-age cooldown is waived only for explicitly reviewed packages.
# `eve`, `@evelandhq/sandbox-bwrap`, and `@evelandhq/workflow-world` are
# excluded by name rather than by version because they are frequently released
# first-party packages; the @ai-sdk and ai entries are pinned third-party
# decisions.
#
# The @workflow/* entries are TWO reviewed graphs that coexist on purpose.
# `@workflow/world-postgres@5.0.0-beta.34` and the beta.17/8/36/27 line below
# it are the legacy World, kept only for Releases built before the shared
# World and never selected for a new build. The Workflow 5.5 set (world 5.2.0,
# errors 5.1.1, world-local 5.3.0, utils 5.1.0) is what
# `@evelandhq/workflow-world` 1.x pins -- the set eve 1.0.0 bundles.
minimumReleaseAgeExclude:
  - eve
  - "@evelandhq/sandbox-bwrap"
  - "@evelandhq/workflow-world"
  - "@ai-sdk/gateway@4.0.85"
  - "@ai-sdk/provider-utils@5.0.43"
  - "@ai-sdk/provider@4.0.17"
  - ai@7.0.105
  # pnpm applies only the FIRST entry whose name matches a package, so a
  # package needed at several versions takes one entry with a version union.
  - "@workflow/errors@5.0.0-beta.17 || 5.1.1"
  - "@workflow/utils@5.0.0-beta.8 || 5.1.0"
  - "@workflow/world-local@5.0.0-beta.36 || 5.3.0"
  - "@workflow/world-postgres@5.0.0-beta.34"
  - "@workflow/world@5.0.0-beta.27 || 5.2.0"
