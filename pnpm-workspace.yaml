packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  cbor-extract: true
  esbuild: true
  sharp: true
  workerd: true
overrides:
  "react-jsx-parser>@types/react": 19.2.17
  "react-jsx-parser>@types/react-dom": 19.2.3
# The workspace defaults to Eve 0.27.8 and the compatibility matrix also pins
# Eve 0.25.3 and 0.26.2. Imported Agents may use any verified minor in the
# three-version window. Waive the release-age cooldown only for this explicitly
# reviewed package.
minimumReleaseAgeExclude:
  - eve
