packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  cbor-extract: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
overrides:
  "react-jsx-parser>@types/react": 19.2.17
  "react-jsx-parser>@types/react-dom": 19.2.3
# The workspace defaults to Eve 0.29.4 and the compatibility matrix also pins
# Eve 0.27.13 and 0.28.0. Imported Agents may use any verified minor in the
# three-version window. Waive the release-age cooldown only for this explicitly
# reviewed package.
minimumReleaseAgeExclude:
  - eve
  - '@ai-sdk/gateway@4.0.33'
  - '@ai-sdk/provider-utils@5.0.16'
  - ai@7.0.44
