packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  cbor-extract: true
  esbuild: true
  sharp: true
  workerd: true
# The workspace tracks the newest Eve 0.24.x; the dependency ranges bound what
# can install, so the release-age cooldown is waived for the whole package.
minimumReleaseAgeExclude:
  - eve
