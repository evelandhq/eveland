packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  cbor-extract: true
  esbuild: true
  sharp: true
  workerd: true
# The workspace defaults to Eve 0.25.1 and the compatibility matrix also pins
# Eve 0.24.6. Imported Agents may use either verified minor. Waive the release-age
# cooldown only for this explicitly reviewed package.
minimumReleaseAgeExclude:
  - eve
