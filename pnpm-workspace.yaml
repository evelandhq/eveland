packages:
  - "apps/*"
  - "packages/*"
catalog:
  eve: 0.76.0
catalogs:
  eve-matrix:
    eve-previous: npm:eve@0.74.0
  # The published SDK's contract is narrower than the platform's. It imports
  # four primitives from eve/channels/auth, stable across 0.27-0.40, while the
  # policy's peerDependencyRange tracks what Eveland can actually host and
  # slides every minor. Tying the SDK to that forced a republish per slide and
  # left consumers on a newer eve with a spurious peer warning in between. The
  # floor still follows the window; only the ceiling is independent.
  #
  # There is no eve-peer catalog: the only package that consumed it was
  # sandbox-bwrap, which now lives in its own repository and declares its own,
  # deliberately wider peer range. The platform's hosting window survives as
  # EVE_COMPATIBILITY_POLICY.peerDependencyRange, which still pins this floor.
  eve-sdk-peer:
    eve: ">=0.74.0 <1.0.0"
allowBuilds:
  cbor-extract: true
  esbuild: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  workerd: true
overrides:
  "react-jsx-parser>@types/react": 19.3.0
  "react-jsx-parser>@types/react-dom": 19.3.0
  # Security floors for transitive deps whose parents pin vulnerable versions
  # exactly (Dependabot alerts, 2026-08-24). Drop each once the parent moves:
  # miniflare pins sharp/undici exactly per release; ansi-to-react declares
  # linkify-it ^3 (5.0.2 ships a CJS build, API-compatible); drizzle-kit's
  # deprecated @esbuild-kit chain pins esbuild ~0.18.
  # sharp floor raised to 0.35.4 for GHSA-rgj7-g3m4-5g8c (libheif), 2026-09-15.
  "miniflare>sharp": "^0.35.4"
  "miniflare>undici": "^7.29.0"
  "ansi-to-react>linkify-it": "^5.0.2"
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
peerDependencyRules:
  allowedVersions:
    # @pierre/trees 1.0.0-beta.6 (still the latest) pins @pierre/theming 1.0.0,
    # whose peer range predates @pierre/theme 2.0 that @pierre/diffs 1.3+ pins.
    # theming only lazy-imports the ten `@pierre/theme/pierre-*` subpaths, and
    # theme 2.0 still exports every one of them (theming 1.0.1 widened its own
    # range to ^1.1.0 || ^2.0.0). Drop this once trees moves to theming 1.0.1+.
    "@pierre/theming@1.0.0>@pierre/theme": "2"
# The Eve catalogs are a package-manager projection of the browser-safe policy
# in packages/core/src/eve-compatibility.ts. Imported Agents may use any
# verified minor in the current window (0.74.x and 0.76.x -- a gapped window:
# 0.76.0 entered on 2026-10-10 and 0.75 retired with it, one day after it had
# entered and before any Eveland release carried it; 0.75.1 had entered on
# 2026-10-09 and 0.68 retired with it, Eveland v0.61.0 having carried 0.74
# since 2026-10-08; 0.75 sits inside the hull and is rejected; 0.73 had entered on 2026-10-08
# and 0.74.0 replaced it the same day, before any Eveland release carried it,
# as 0.73 had replaced 0.72, 0.72 had replaced 0.70 and 0.70 had replaced
# 0.69; 0.68 and every earlier line are below the floor). eve-matrix names
# every line but the newest, which is the plain `eve` catalog entry.
#
# The release-age cooldown is waived only for explicitly reviewed packages.
# `eve`, `@evelandhq/sandbox-bwrap`, and `@evelandhq/workflow-world` are
# excluded by name rather than by version because they are frequently released
# first-party packages; the @ai-sdk and ai entries are pinned third-party
# decisions.
#
# The @workflow/* entries are TWO reviewed graphs that coexist on purpose.
# `@workflow/world-postgres@5.0.0-beta.34` and the beta.17/8/36/27 line below
# it are the legacy World, spec-v6 throughout, kept only for Releases built
# before the shared World and never selected for a new build. The stable
# 5.0.1 line (world/world-local/errors 5.0.1, utils 5.0.0) is what
# `@evelandhq/workflow-world` 0.24.0 pins -- the release of the family eve
# moved to at 0.70.2 (spec constants untouched, the World interface only gains
# optional members), which 0.72.1 carried; 0.73.0 through 0.75.0 carry core
# 5.1.0 and world/world-local/errors 5.0.2, and 0.75.1 and 0.76.0 the stable
# 5.2 family (core 5.2.0, world/errors 5.0.3, world-local 5.1.0) -- the same World calls
# and spec constants throughout, only optional members added. eve compares
# only the major and prerelease tag of the World's declaration, so the same
# World serves the whole window. The 5.0.1 `@workflow/world` reports
# SPEC_VERSION_CURRENT 8 (the hook force-claim reader contract), but since
# 0.23.0 the shared World DECLARES `Math.min(mintedSpecVersion(), 7)` -- the
# sealed log, or 6 for a Deployment that opts out with WORKFLOW_SEALED_LOG=0
# (0.18.0 through 0.22.0 declared `mintedSpecVersion()` outright, which was 7
# on their @workflow/world; 0.5.0 through 0.17.0 always declared 6) -- because
# 0.62.0's runtime read spec 6 through 7 only and would have refused a World
# declaring 8 at startup (0.74.0 and 0.76.0 read 6 through 8). eve gates on the declared number, which the contract
# ratchet reads out of the World's dist and asserts per line; the platform
# admits both 6 and 7 (SUPPORTED_WORKFLOW_STORAGE_SPECS).
minimumReleaseAgeExclude:
  - eve
  - "@evelandhq/sandbox-bwrap"
  - "@evelandhq/workflow-world"
  - "@ai-sdk/gateway@4.0.85"
  - "@ai-sdk/provider-utils@5.0.43"
  - "@ai-sdk/provider@4.0.17"
  - ai@7.0.105
  - "@workflow/errors@5.0.0-beta.17"
  - "@workflow/errors@5.0.1"
  - "@workflow/utils@5.0.0-beta.8"
  - "@workflow/utils@5.0.0"
  - "@workflow/world-local@5.0.0-beta.36"
  - "@workflow/world-local@5.0.1"
  - "@workflow/world-postgres@5.0.0-beta.34"
  - "@workflow/world@5.0.0-beta.27"
  - "@workflow/world@5.0.1"
